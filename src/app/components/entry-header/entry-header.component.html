<p-card>
  <div class="header-layout">

    <div class="header-left">
      <span class="user-name-label">{{ userName }}</span>
      <button type="button" class="add-btn" (click)="showCreateDialog()"
        [attr.aria-label]="'Adicionar despesa de ' + userName">
        <span class="add-btn-icon" aria-hidden="true"><i class="pi pi-plus"></i></span>
        <span class="add-btn-text">Nova despesa</span>
      </button>
    </div>

    <div class="metrics-row">
      <div class="metric-block total-block"
           [pTooltip]="totalTooltip"
           tooltipPosition="bottom"
           [escape]="false">
        <span class="metric-label">Total <i class="pi pi-info-circle total-info-icon"></i></span>
        <span class="metric-value">{{ subTotal | brl }}</span>
      </div>

      <div class="metric-block">
        <span class="metric-label">Individual</span>
        <span class="metric-value">{{ totalPersonal | brl }}</span>
      </div>

      <div class="metric-block saldo-block">
        <span class="metric-label">Saldo</span>
        <span class="metric-value" [ngClass]="{
          positive: (saldo ?? 0) > 0,
          negative: (saldo ?? 0) < 0,
          neutral: saldo === 0
        }">{{ saldo | brl }}</span>
      </div>
    </div>

  </div>
</p-card>

<p-dialog header="Nova Despesa" [modal]="true" [(visible)]="visible" [style]="{'width': '36rem'}" [breakpoints]="{'768px': '92vw'}">
  <app-entry-form [userId]="userHeader?.id"></app-entry-form>
</p-dialog>
